<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TwExtender</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans KR", "Noto Sans JP", sans-serif;
      color-scheme: light dark;
      --bg: #f4f6f8;
      --panel: #fff;
      --text: #17202a;
      --muted: #657181;
      --border: #d9e0e7;
      --accent: #1677ff;
      --error: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101419;
        --panel: #181e25;
        --text: #edf2f7;
        --muted: #a4b0bd;
        --border: #35404c;
        --accent: #5b9cff;
        --error: #ff8585;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    main {
      width: min(40rem, calc(100% - 2rem));
      margin: 2.5rem auto 3rem;
    }
    .content {
      margin: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: 1.05rem;
    }
    .content.err { color: var(--error); white-space: normal; }
    .cta { margin: 2.5rem 0 0; }
    .cta a {
      color: var(--accent);
      font-weight: 650;
      text-underline-offset: .15em;
    }
    .cta a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .gallery { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.25rem; }
    .gallery:empty { display: none; }
    .gallery iframe,
    .gallery img,
    .pinned iframe,
    .pinned img {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #000;
    }
    .gallery iframe { aspect-ratio: 16 / 9; }
    .pinned {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      background: var(--bg);
      padding: .5rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .pinned[hidden] { display: none; }
    .pinned .slot { width: min(40rem, calc(42vh * 16 / 9), 100%); margin: 0 auto; }
    .pinned iframe { aspect-ratio: 16 / 9; }
    .pinned img { width: auto; max-width: 100%; max-height: 42vh; margin: 0 auto; object-fit: contain; }
  </style>
</head>
<body>
  <div id="pinned-media" class="pinned" hidden><div class="slot"></div></div>
  <main>
    <p id="content" class="content">본문을 불러오는 중…</p>
    <div id="gallery" class="gallery"></div>
    <p class="cta"><a href="/l">나도 긴 트윗 작성해보기 →</a></p>
  </main>
  <script>
    "use strict";

    function fromBase64Url(text) {
      if (!/^[A-Za-z0-9_-]*$/.test(text)) {
        throw new Error("Base64url 데이터에 허용되지 않는 문자가 있습니다.");
      }
      const base64 = text.replace(/-/g, "+").replace(/_/g, "/");
      const padded = base64 + "=".repeat((4 - base64.length % 4) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function streamTransform(bytes, format, operation) {
      const StreamClass = operation === "compress"
        ? window.CompressionStream
        : window.DecompressionStream;

      if (!StreamClass) {
        throw new Error("이 브라우저는 압축 스트림 API를 지원하지 않습니다.");
      }

      const stream = new Blob([bytes]).stream().pipeThrough(new StreamClass(format));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    const IMAGE_EXTENSIONS = new Set([
      "jpg", "jpeg", "jpe", "jfif", "png", "gif", "webp", "avif",
      "bmp", "tif", "tiff", "heic", "heif", "jxl", "ico"
    ]);

    function isImageExtension(extension) {
      return IMAGE_EXTENSIONS.has(String(extension).toLowerCase());
    }

    function canonicalImageUrl(raw) {
      let url;
      try {
        url = new URL(raw);
      } catch {
        return null;
      }
      if (url.protocol !== "https:" || url.username || url.password) return null;
      const host = url.hostname.toLowerCase();
      if (host === "pbs.twimg.com") {
        const parts = url.pathname.split("/").filter(Boolean);
        if (parts.length !== 2 || parts[0] !== "media") return null;
        let name = parts[1];
        let size = null;
        const colon = name.indexOf(":");
        if (colon !== -1) {
          size = name.slice(colon + 1);
          name = name.slice(0, colon);
        }
        let extension = null;
        const dot = name.lastIndexOf(".");
        let id = name;
        if (dot !== -1) {
          extension = name.slice(dot + 1);
          id = name.slice(0, dot);
        }
        if (url.searchParams.get("format")) extension = url.searchParams.get("format");
        if (url.searchParams.get("name")) size = url.searchParams.get("name");
        if (!extension || !isImageExtension(extension) || !/^[A-Za-z0-9_-]+$/.test(id)) return null;
        if (size && !/^[A-Za-z0-9]+$/.test(size)) return null;
        extension = extension.toLowerCase();
        if (url.searchParams.has("format")) {
          let canonical = `https://pbs.twimg.com/media/${id}?format=${extension}`;
          if (size) canonical += `&name=${size}`;
          return canonical;
        }
        let canonical = `https://pbs.twimg.com/media/${id}.${extension}`;
        if (size) canonical += `:${size}`;
        return canonical;
      }
      if (host === "i.ibb.co") {
        if (url.search || url.hash) return null;
        const parts = url.pathname.split("/").filter(Boolean);
        if (!parts.length || parts.some((part) => part === "." || part === ".." || !/^[\w.-]+$/.test(part))) return null;
        const file = parts[parts.length - 1];
        const dot = file.lastIndexOf(".");
        if (dot <= 0 || !isImageExtension(file.slice(dot + 1))) return null;
        return "https://i.ibb.co/" + parts.join("/");
      }
      return null;
    }

    function mediaElement(item) {
      if (!item || typeof item !== "object") return null;
      if (item.type === "youtube") {
        if (!/^[A-Za-z0-9_-]{11}$/.test(item.id || "")) return null;
        const embed = new URL(`https://www.youtube-nocookie.com/embed/${item.id}`);
        if (item.list && item.list !== "WL" && /^[A-Za-z0-9_-]{2,64}$/.test(item.list)) {
          embed.searchParams.set("list", item.list);
        }
        if (Number.isInteger(item.start) && item.start > 0) embed.searchParams.set("start", String(item.start));
        if (Number.isInteger(item.end) && item.end > 0) embed.searchParams.set("end", String(item.end));
        const iframe = document.createElement("iframe");
        iframe.src = embed.toString();
        iframe.allowFullscreen = true;
        iframe.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share");
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        return iframe;
      }
      if (item.type === "image") {
        const src = canonicalImageUrl(item.url || "");
        if (!src) return null;
        const image = document.createElement("img");
        image.alt = "";
        image.src = src;
        image.referrerPolicy = "no-referrer";
        return image;
      }
      return null;
    }

    function placeMedia(node, pinned) {
      if (pinned) {
        const slot = document.querySelector("#pinned-media .slot");
        slot.replaceChildren(node);
        document.getElementById("pinned-media").hidden = false;
      } else {
        document.getElementById("gallery").appendChild(node);
      }
    }

    function layoutPinned() {
      const pinned = document.getElementById("pinned-media");
      const main = document.querySelector("main");
      main.style.marginTop = pinned.hidden ? "" : `calc(${pinned.offsetHeight}px + 1.5rem)`;
    }

    async function decodePayload(value) {
      if (!value || !/^[zdmn]/.test(value)) {
        throw new Error("데이터는 z, d, m, n 접두사로 시작해야 합니다.");
      }

      const mode = value[0];
      const encodedBytes = fromBase64Url(value.slice(1));
      const MAX_DECODED_BYTES = 2 * 1024 * 1024;
      let bytes;

      if (mode === "z" || mode === "n") {
        bytes = await streamTransform(encodedBytes, "deflate", "decompress");
      } else {
        bytes = encodedBytes;
      }

      if (bytes.length > MAX_DECODED_BYTES) {
        throw new Error("복원된 본문이 데모의 최대 허용 크기(2 MiB)를 초과합니다.");
      }

      const text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      if (mode === "z" || mode === "d") return { text, media: [] };

      let data;
      try {
        data = JSON.parse(text);
      } catch {
        throw new Error("미디어 데이터 형식이 올바르지 않습니다.");
      }
      if (!data || typeof data.text !== "string" || (data.media != null && !Array.isArray(data.media))) {
        throw new Error("미디어 데이터 형식이 올바르지 않습니다.");
      }
      return { text: data.text, media: Array.isArray(data.media) ? data.media : [] };
    }

    (async function showTweet() {
      const content = document.getElementById("content");
      try {
        const value = new URL(window.location.href).searchParams.get("t");
        if (value === null) throw new Error("표시할 본문이 없습니다.");
        const payload = await decodePayload(value);
        content.textContent = payload.text;

        let pinned = false;
        for (const item of payload.media) {
          const node = mediaElement(item);
          if (!node) continue;
          const pinThis = !pinned && item.pin === true;
          if (pinThis) pinned = true;
          placeMedia(node, pinThis);
          if (node.tagName === "IMG") node.addEventListener("load", layoutPinned);
        }
        layoutPinned();
        window.addEventListener("resize", layoutPinned);
      } catch (error) {
        content.className = "content err";
        content.textContent = error.message || "본문을 표시하지 못했습니다.";
      }
    })();
  </script>
</body>
</html>
